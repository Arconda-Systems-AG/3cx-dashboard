  THREECX_CLIENT_ID: "apitest"
  THREECX_CLIENT_SECRET: "DEIN_SECRET_HIER"
  # Optional: Legacy Web-Auth Fallback
  # THREECX_WEB_USER: "87"
  # THREECX_WEB_PASSWORD: "DEIN_PASSWORT"
