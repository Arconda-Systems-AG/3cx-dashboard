# Dieses File NICHT committen – nur als Vorlage
# Kopiere nach secret.yaml und fülle die Werte aus:
#   cp k8s-arconda/secret.example.yaml k8s-arconda/secret.yaml
#   kubectl apply -f k8s-arconda/secret.yaml
#
# Hinweis: Die 3CX-Verbindungsdaten werden über die Settings-GUI konfiguriert
# und in /app/data/settings.json (PVC) persistiert.
apiVersion: v1
kind: Secret
metadata:
  name: threecx-credentials
  namespace: mandant-arconda
type: Opaque
stringData:
  THREECX_URL: "https://arconda.3cx.de"
  THREECX_CLIENT_ID: ""
  THREECX_CLIENT_SECRET: ""
  # Optional: Legacy Web-Auth Fallback
  # THREECX_WEB_USER: ""
  # THREECX_WEB_PASSWORD: ""
